version: "3.8"
services:
  app:
    build: .
    container_name: nodejs-container
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongodb
  mongodb:
    image: mongo:6
    container_name: mongodb-container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data: